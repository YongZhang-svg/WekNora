root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = "./tmp/main"
  cmd = "go build -ldflags=\"$(./scripts/get_version.sh ldflags) -X 'google.golang.org/protobuf/reflect/protoregistry.conflictPolicy=warn'\" -o ./tmp/main ./cmd/server"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "frontend", "migrations", "node_modules", "docs", "logs", "data", "WeKnora-Chrome-Extension", "Formula", "dataset", "docreader", "docker", "llm_debug", "web", "mcp-server", "misc", "scripts", "dist", "client", "helm"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  # 使用 full_bin 来加载 .env 文件并设置本地开发环境变量
  # 直接运行 air 时不会自动加载 .env，导致 DB_DRIVER 等变量为空
  # 这里先 source .env，再覆盖本地开发地址（Docker 容器地址 -> localhost）
  full_bin = "bash -c 'set -a && . ./.env && set +a && export DB_HOST=localhost DOCREADER_ADDR=localhost:50051 DOCREADER_TRANSPORT=grpc MINIO_ENDPOINT=localhost:9000 REDIS_ADDR=localhost:6379 NEO4J_URI=bolt://localhost:7687 QDRANT_HOST=localhost MILVUS_ADDRESS=localhost:19530 OTEL_EXPORTER_OTLP_ENDPOINT=localhost:4317 && ./tmp/main'"
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html", "yaml"]
  include_file = []
  kill_delay = "2s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true

